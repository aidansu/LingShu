model_providers:
  deepseek:
    client: "deepseek"
    models:
      deepseek-chat:
        model_name:
        - "deepseek-chat"
      deepseek-reasoner:
        model_name:
        - "deepseek-reasoner"
  dashscope:
    client: "openai"  # 使用OpenAI兼容客户端
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    models:
      qwen-plus:
        model_name:
        - "qwen-plus"
  qianfan:
    client: "openai"  # 使用OpenAI兼容客户端
    base_url: "https://qianfan.baidubce.com/v2"
    models:
      ernie-4:
        model_name:
        - "ernie-4.0-8k"
  zhipuai:
    client: "zhipuai"
    models:
      glm-4:
        model_name:
        - "glm-4"
        - "glm-4-air"
  siliconflow:
    client: "siliconflow"
    models:
      deepseek-r1:
        model_name:
        - "deepseek-ai/DeepSeek-R1-Distill-Qwen-7B"